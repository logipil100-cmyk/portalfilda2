<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <!-- Text Paths for Circular Text -->
    <path id="topArch" d="M 70,290 A 180,180 0 0,1 430,290" fill="none" />
    <path id="bottomArch" d="M 430,290 A 180,180 0 0,1 70,290" fill="none" />
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Royal Crown at Top (No Red Background) -->
    <g transform="translate(130, 10)">
      <!-- Crown Base & Points -->
      <path d="M 20,120 L 0,40 L 55,75 L 120,0 L 185,75 L 240,40 L 220,120 Z" fill="url(#crownGrad)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" />
      <!-- Inner Crown Details -->
      <path d="M 30,110 L 15,55 L 60,85 L 120,20 L 180,85 L 225,55 L 210,110 Z" fill="none" stroke="#64748b" stroke-width="3" />
      <!-- Crown Jewels / Stars -->
      <polygon points="120,-15 125,-5 135,-5 127,2 130,12 120,6 110,12 113,2 105,-5 115,-5" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="35" r="7" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="240" cy="35" r="7" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="55" cy="70" r="5" fill="#0f172a" />
      <circle cx="185" cy="70" r="5" fill="#0f172a" />
      <path d="M 20,120 L 220,120" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Outer Black Ring -->
    <circle cx="250" cy="290" r="210" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
    <!-- White Inner Circle -->
    <circle cx="250" cy="290" r="165" fill="url(#crestBg)" stroke="#0f172a" stroke-width="6" />
    
    <!-- Inner Accent Ring -->
    <circle cx="250" cy="290" r="158" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Circular Text: ESCOLA DE FORMAÇÃO DESPORTIVA -->
    <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="3">
      <textPath href="#topArch" startOffset="50%" text-anchor="middle">
        ESCOLA DE FORMAÇÃO DESPORTIVA
      </textPath>
    </text>

    <!-- Top Text: FILDA II -->
    <text x="250" y="185" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="32" fill="#0f172a" text-anchor="middle" letter-spacing="2">
      FILDA II
    </text>

    <!-- Birds flying in background -->
    <g fill="#334155" transform="translate(130, 240) scale(0.7)">
      <path d="M 0,0 Q 8,-10 16,0 Q 24,-10 32,0 Q 24,-5 16,-2 Q 8,-5 0,0 Z" />
      <path d="M -25,25 Q -19,-3 -13,25 Q -7,-3 -1,25 Q -7,20 -13,22 Q -19,20 -25,25 Z" />
      <path d="M 20,35 Q 26,27 32,35 Q 38,27 44,35 Q 38,32 32,33 Q 26,32 20,35 Z" />
    </g>

    <!-- Soccer Balls -->
    <g transform="translate(180, 210)">
      <!-- Background Ball (smaller) -->
      <circle cx="65" cy="15" r="32" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
      <path d="M 65,-5 L 77,5 L 73,19 L 57,19 L 53,5 Z" fill="#0f172a" />
      <path d="M 65,-5 L 65,-17 M 77,5 L 89,0 M 73,19 L 85,29 M 57,19 L 45,29 M 53,5 L 41,0" stroke="#0f172a" stroke-width="2.5" />
      
      <!-- Foreground Ball (larger) -->
      <circle cx="30" cy="40" r="42" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
      <!-- Soccer Pentagon pattern -->
      <polygon points="30,22 46,34 40,53 20,53 14,34" fill="#0f172a" />
      <line x1="30" y1="22" x2="30" y2="4" stroke="#0f172a" stroke-width="3" />
      <line x1="46" y1="34" x2="63" y2="28" stroke="#0f172a" stroke-width="3" />
      <line x1="40" y1="53" x2="52" y2="70" stroke="#0f172a" stroke-width="3" />
      <line x1="20" y1="53" x2="8" y2="70" stroke="#0f172a" stroke-width="3" />
      <line x1="14" y1="34" x2="-3" y2="28" stroke="#0f172a" stroke-width="3" />
      <!-- Outer black triangles -->
      <polygon points="30,4 20,-1 40,-1" fill="#0f172a" />
      <polygon points="63,28 71,18 73,38" fill="#0f172a" />
      <polygon points="52,70 65,75 48,82" fill="#0f172a" />
      <polygon points="8,70 -5,75 12,82" fill="#0f172a" />
      <polygon points="-3,28 -11,18 -13,38" fill="#0f172a" />
    </g>

    <!-- Colorful Urban Buildings (FILDA / Kilamba Condos) -->
    <g transform="translate(150, 275)">
      <!-- Green Building -->
      <rect x="0" y="35" width="22" height="75" fill="#15803d" stroke="#0f172a" stroke-width="2" />
      <path d="M 0,35 L 8,27 L 30,27 L 22,35 Z" fill="#166534" stroke="#0f172a" stroke-width="2" />
      <rect x="22" y="35" width="8" height="75" fill="#14532d" stroke="#0f172a" stroke-width="2" />
      <g fill="#ffffff">
        <rect x="4" y="42" width="5" height="6" /><rect x="12" y="42" width="5" height="6" />
        <rect x="4" y="54" width="5" height="6" /><rect x="12" y="54" width="5" height="6" />
        <rect x="4" y="66" width="5" height="6" /><rect x="12" y="66" width="5" height="6" />
        <rect x="4" y="78" width="5" height="6" /><rect x="12" y="78" width="5" height="6" />
        <rect x="4" y="90" width="5" height="6" /><rect x="12" y="90" width="5" height="6" />
      </g>

      <!-- Orange Building -->
      <rect x="30" y="20" width="24" height="90" fill="#c2410c" stroke="#0f172a" stroke-width="2" />
      <path d="M 30,20 L 38,12 L 62,12 L 54,20 Z" fill="#9a3412" stroke="#0f172a" stroke-width="2" />
      <rect x="54" y="20" width="8" height="90" fill="#7c2d12" stroke="#0f172a" stroke-width="2" />
      <g fill="#ffffff">
        <rect x="35" y="28" width="6" height="7" /><rect x="45" y="28" width="6" height="7" />
        <rect x="35" y="42" width="6" height="7" /><rect x="45" y="42" width="6" height="7" />
        <rect x="35" y="56" width="6" height="7" /><rect x="45" y="56" width="6" height="7" />
        <rect x="35" y="70" width="6" height="7" /><rect x="45" y="70" width="6" height="7" />
        <rect x="35" y="84" width="6" height="7" /><rect x="45" y="84" width="6" height="7" />
      </g>

      <!-- Yellow Building -->
      <rect x="62" y="10" width="26" height="100" fill="#eab308" stroke="#0f172a" stroke-width="2" />
      <path d="M 62,10 L 70,2 L 96,2 L 88,10 Z" fill="#ca8a04" stroke="#0f172a" stroke-width="2" />
      <rect x="88" y="10" width="8" height="100" fill="#a16207" stroke="#0f172a" stroke-width="2" />
      <g fill="#ffffff">
        <rect x="68" y="18" width="6" height="7" /><rect x="78" y="18" width="6" height="7" />
        <rect x="68" y="32" width="6" height="7" /><rect x="78" y="32" width="6" height="7" />
        <rect x="68" y="46" width="6" height="7" /><rect x="78" y="46" width="6" height="7" />
        <rect x="68" y="60" width="6" height="7" /><rect x="78" y="60" width="6" height="7" />
        <rect x="68" y="74" width="6" height="7" /><rect x="78" y="74" width="6" height="7" />
        <rect x="68" y="88" width="6" height="7" /><rect x="78" y="88" width="6" height="7" />
      </g>

      <!-- Red Building -->
      <rect x="96" y="-15" width="34" height="125" fill="#dc2626" stroke="#0f172a" stroke-width="2" />
      <path d="M 96,-15 L 108,-27 L 142,-27 L 130,-15 Z" fill="#b91c1c" stroke="#0f172a" stroke-width="2" />
      <rect x="130" y="-15" width="12" height="125" fill="#991b1b" stroke="#0f172a" stroke-width="2" />
      <g fill="#ffffff">
        <rect x="103" y="-5" width="7" height="9" /><rect x="116" y="-5" width="7" height="9" />
        <rect x="103" y="12" width="7" height="9" /><rect x="116" y="12" width="7" height="9" />
        <rect x="103" y="29" width="7" height="9" /><rect x="116" y="29" width="7" height="9" />
        <rect x="103" y="46" width="7" height="9" /><rect x="116" y="46" width="7" height="9" />
        <rect x="103" y="63" width="7" height="9" /><rect x="116" y="63" width="7" height="9" />
        <rect x="103" y="80" width="7" height="9" /><rect x="116" y="80" width="7" height="9" />
        <rect x="103" y="97" width="7" height="9" /><rect x="116" y="97" width="7" height="9" />
      </g>

      <!-- Blue Building -->
      <rect x="142" y="15" width="28" height="95" fill="#0284c7" stroke="#0f172a" stroke-width="2" />
      <path d="M 142,15 L 152,5 L 180,5 L 170,15 Z" fill="#0369a1" stroke="#0f172a" stroke-width="2" />
      <rect x="170" y="15" width="10" height="95" fill="#075985" stroke="#0f172a" stroke-width="2" />
      <g fill="#ffffff">
        <rect x="149" y="25" width="6" height="8" /><rect x="159" y="25" width="6" height="8" />
        <rect x="149" y="40" width="6" height="8" /><rect x="159" y="40" width="6" height="8" />
        <rect x="149" y="55" width="6" height="8" /><rect x="159" y="55" width="6" height="8" />
        <rect x="149" y="70" width="6" height="8" /><rect x="159" y="70" width="6" height="8" />
        <rect x="149" y="85" width="6" height="8" /><rect x="159" y="85" width="6" height="8" />
      </g>

      <!-- Ground line -->
      <line x1="-10" y1="110" x2="190" y2="110" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Motto in Cursive Script -->
    <text x="250" y="405" font-family="'Brush Script MT', 'Lucida Handwriting', 'Georgia', cursive" font-style="italic" font-weight="bold" font-size="19" fill="#0f172a" text-anchor="middle">
      Crescer disciplinado e com saude
    </text>

    <!-- SINCE 2025 HDP -->
    <text x="250" y="426" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      SINCE
    </text>
    <text x="250" y="445" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      2025
    </text>
    <text x="250" y="460" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="2">
      HDP
    </text>
  </g>
</svg>
